services:
  backend:
    build: ./backend/docker
    container_name: mon_projet_backend
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mariadb
      - redis
      - rabbitmq
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DATABASE_URL: mysql://stue:MonPass123@mariadb:3306/marketplace_b2b
      REDIS_URL: redis://redis:6379
      RABBITMQ_DSN: amqp://guest:guest@rabbitmq:5672
    command: bash -c "mkdir -p /var/www/html/var/cache/prod/vich_uploader && chown -R www-data:www-data /var/www/html/var/cache && apache2-foreground"
  
  frontend:
    build: ./frontend
    container_name: mon_projet_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  mariadb:
    image: mariadb:10.11
    container_name: mon_projet_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mon_projet
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mariadb_data:/var/lib/mysql
  redis:
    image: redis:7-alpine
    container_name: mon_projet_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: mon_projet_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  adminer:
    image: adminer:latest
    container_name: mon_projet_adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mariadb

volumes:
  mariadb_data:
