version: '3.8'

services:

  backend:
    build: ./backend/docker
    container_name: mon_projet_backend
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mariadb
      - redis
      - rabbitmq
    environment:
      DATABASE_URL: mysql://user:password@mariadb:3306/mon_projet
      REDIS_URL: redis://redis:6379
      RABBITMQ_DSN: amqp://guest:guest@rabbitmq:5672

  frontend:
    build: ./frontend
    container_name: mon_projet_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  mariadb:
    image: mariadb:10.11
    container_name: mon_projet_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mon_projet
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: mon_projet_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: mon_projet_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  mariadb_data:
